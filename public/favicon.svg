<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#0f1d2e"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#4a9e6b" stroke-width="2"/>
  <!-- Mountain shape -->
  <polygon points="50,16 25,64 75,64" fill="#4a9e6b"/>
  <polygon points="34,64 16,64 34,42" fill="#2a7a50"/>
  <polygon points="66,64 84,64 66,44" fill="#2a7a50"/>
  <!-- Snow cap -->
