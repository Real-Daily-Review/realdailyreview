name = "rdr-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Disable workers.dev subdomain — only reachable via our route below
workers_dev = false

# Bind /api/* on apex + www to this Worker. Pages still serves everything else.
routes = [
  { pattern = "realdailyreview.com/api/*", zone_id = "0e483a913db9070a2f01144ed97eff54" },
  { pattern = "www.realdailyreview.com/api/*", zone_id = "0e483a913db9070a2f01144ed97eff54" },
]

[[d1_databases]]
binding = "DB"
database_name = "rdr-prod"
database_id = "af854dd0-1da8-4964-9ccc-3fb5e06ceb81"

[vars]
SITE_ORIGIN = "https://realdailyreview.com"
RATE_LIMIT_PER_MIN = "5"

# Secrets set via:
#   wrangler secret put TURNSTILE_SECRET
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ADMIN_TOKEN
