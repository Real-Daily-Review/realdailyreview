# Last forced redeploy: 2026-05-09T14:26Z (sync ADMIN_TOKEN)
name = "rdr-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Worker is reachable on rdr-api.<your-subdomain>.workers.dev by default.
# To bind /api/* on realdailyreview.com requires either (a) regenerating
# the CLOUDFLARE_API_TOKEN with "Zone → Workers Routes → Edit" permission
# added, or (b) one-time dashboard click: Workers & Pages → rdr-api →
# Settings → Triggers → Add Custom Domain → realdailyreview.com → /api/*
# Until bound, browser-side fetches to /api/subscribe etc. fail.
workers_dev = true
# routes = [
#   { pattern = "realdailyreview.com/api/*", zone_id = "0e483a913db9070a2f01144ed97eff54" },
#   { pattern = "www.realdailyreview.com/api/*", zone_id = "0e483a913db9070a2f01144ed97eff54" },
# ]

[[d1_databases]]
binding = "DB"
database_name = "rdr-prod"
database_id = "af854dd0-1da8-4964-9ccc-3fb5e06ceb81"

[vars]
SITE_ORIGIN = "https://realdailyreview.com"
RATE_LIMIT_PER_MIN = "5"

# Secrets set via:
#   wrangler secret put TURNSTILE_SECRET
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ADMIN_TOKEN
