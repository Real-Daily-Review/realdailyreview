# Last forced redeploy: 2026-05-09T14:33Z (RESEND retry)
name = "rdr-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Routes are bound at realdailyreview.com/api/* and www.realdailyreview.com/api/*
# (added via CF dashboard 2026-05-09). Disable the workers.dev URL so the
# Worker is ONLY reachable on our domain — eliminates a second attack surface
# (without this anyone could call rdr-api.<subdomain>.workers.dev directly,
# bypassing CSP / referer checks targeted at our origin).
workers_dev = false
# routes = [
#   { pattern = "realdailyreview.com/api/*", zone_id = "0e483a913db9070a2f01144ed97eff54" },
#   { pattern = "www.realdailyreview.com/api/*", zone_id = "0e483a913db9070a2f01144ed97eff54" },
# ]

[[d1_databases]]
binding = "DB"
database_name = "rdr-prod"
database_id = "af854dd0-1da8-4964-9ccc-3fb5e06ceb81"

[vars]
SITE_ORIGIN = "https://realdailyreview.com"
RATE_LIMIT_PER_MIN = "5"

