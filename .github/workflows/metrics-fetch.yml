name: Metrics fetch

# Pulls traffic + subscriber stats every 4 hours so every agent reads
# the same numbers from ops/metrics/<date>.json. Without this, Mei and
# Ravi were operating blind.

on:
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours
  push:
    tags:
      - 'metrics-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.RDR_ADMIN_TOKEN }}
        run: node scripts/fetch-traffic-stats.mjs
      - run: |
          git config user.name "Sam Reyes (SRE)"
          git config user.email "sam@realdailyreview.com"
          git add ops/metrics/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "metrics: $(date -u +%Y-%m-%dT%H:%MZ) [run ${{ github.run_id }}]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          exit 1
