name: Bluesky cross-poster

# Posts every new article to Bluesky. Inert until BLUESKY_HANDLE +
# BLUESKY_APP_PASSWORD secrets are set. Bluesky has no phone-verification
# requirement so signup is ~30 seconds.

on:
  schedule:
    # Every 2 hours so we catch each publish window
    - cron: '15 */2 * * *'
  push:
    tags:
      - 'bsky-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluesky-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: npm install gray-matter@^4 @anthropic-ai/sdk@^0.30 --no-save --no-audit --no-fund
      - env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/bluesky-poster.mjs
      - run: |
          git config user.name "Ravi Sharma (Growth)"
          git config user.email "ravi@realdailyreview.com"
          git add ops/social-posted/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "social: bluesky cross-post $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          exit 1
