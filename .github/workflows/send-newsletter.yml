name: Send daily newsletter

# Fires after the morning publish slot. If RESEND_API_KEY is set, sends
# today's digest to every confirmed subscriber. Inert until you wire Resend.

on:
  schedule:
    # 10:00 UTC (6am ET) — after the 9:15 UTC publish slot has had time to commit
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'  # DST safety
  push:
    tags:
      - 'send-newsletter-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: send-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install gray-matter@^4 --no-save --no-audit --no-fund
      - env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ADMIN_TOKEN: ${{ secrets.RDR_ADMIN_TOKEN }}
        run: node scripts/send-newsletter.mjs
      - run: |
          git config user.name "Real Daily Review Bot"
          git config user.email "bot@realdailyreview.com"
          git add ops/newsletter/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "newsletter: $(date -u +%Y-%m-%d) [run ${{ github.run_id }}]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          exit 1
