name: Daily content publish

on:
  schedule:
    # 5:15 AM ET = 9:15 UTC (winter) / 10:15 UTC (DST). Run both — script is idempotent enough.
    - cron: '15 9 * * 1-5'
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes, no API calls)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: npm run generate:daily

      - name: Lint generated content
        if: github.event.inputs.dry_run != 'true'
        run: npm run lint:content

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Real Daily Review Bot"
          git config user.email "bot@realdailyreview.com"
          if [[ -n "$(git status --porcelain src/content/articles/)" ]]; then
            git add src/content/articles/
            git commit -m "content: $(date -u +%Y-%m-%d) auto-publish"
            git push
          else
            echo "No new articles to commit."
          fi
