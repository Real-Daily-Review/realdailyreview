name: Daily content publish

on:
  schedule:
    # 8 publish cycles per day, every day. Cron in UTC.
    # Each pair is morning/DST-shifted variant; the dedup against last-36h
    # titles prevents duplicate work when adjacent slots both fire.
    # 02:30 / 03:30 UTC — late evening US, Europe morning prep
    - cron: '30 2 * * *'
    - cron: '30 3 * * *'
    # 06:30 / 07:30 UTC — overnight catch (Asia morning, Europe early)
    - cron: '30 6 * * *'
    - cron: '30 7 * * *'
    # 09:15 / 10:15 UTC — US morning brief
    - cron: '15 9 * * *'
    - cron: '15 10 * * *'
    # 12:00 / 13:00 UTC — late US morning
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    # 15:30 / 16:30 UTC — US midday
    - cron: '30 15 * * *'
    - cron: '30 16 * * *'
    # 19:00 / 20:00 UTC — US afternoon
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    # 22:00 / 23:00 UTC — evening recap
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
    # 00:30 / 01:30 UTC — late night / Asia early
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'
  # CEO ad-hoc trigger: pushing a tag matching run-content-* fires the workflow.
  # Useful from environments that can't reach api.github.com but can push.
  push:
    tags:
      - 'run-content-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes, no API calls)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: npm run generate:daily

      - name: Lint generated content
        if: github.event.inputs.dry_run != 'true'
        run: npm run lint:content

      - name: Generate per-article OG images
        if: github.event.inputs.dry_run != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          node scripts/gen-og-images.mjs

      - name: Write run status (always)
        if: always()
        run: |
          mkdir -p ops/runs
          STATUS_FILE="ops/runs/$(date -u +%Y-%m-%dT%H-%M-%SZ).json"
          cat > "$STATUS_FILE" <<EOF
          {
            "trigger": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "started_at": "${{ github.event.repository.updated_at }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "job_status": "${{ job.status }}",
            "articles_added": $(git status --porcelain src/content/articles/ 2>/dev/null | wc -l)
          }
          EOF
          echo "wrote $STATUS_FILE"

      - name: Commit and push to main (with rebase retry)
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Real Daily Review Bot"
          git config user.email "bot@realdailyreview.com"
          git add src/content/articles/ ops/runs/ public/og/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "content: $(date -u +%Y-%m-%d) auto-publish [run ${{ github.run_id }}]"
          # Retry up to 5 times with rebase to handle concurrent commits to main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing on latest main and retrying"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 3; }
          done
          echo "::error::push failed after 5 attempts"
          exit 1
