name: Daily content publish

on:
  schedule:
    # 5:15 AM ET = 9:15 UTC (winter) / 10:15 UTC (DST). Run both — script is idempotent enough.
    - cron: '15 9 * * 1-5'
    - cron: '15 10 * * 1-5'
  # CEO ad-hoc trigger: pushing a tag matching run-content-* fires the workflow.
  # Useful from environments that can't reach api.github.com but can push.
  push:
    tags:
      - 'run-content-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes, no API calls)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: npm run generate:daily

      - name: Lint generated content
        if: github.event.inputs.dry_run != 'true'
        run: npm run lint:content

      - name: Write run status (always)
        if: always()
        run: |
          mkdir -p ops/runs
          STATUS_FILE="ops/runs/$(date -u +%Y-%m-%dT%H-%M-%SZ).json"
          cat > "$STATUS_FILE" <<EOF
          {
            "trigger": "${{ github.event_name }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "run_id": "${{ github.run_id }}",
            "started_at": "${{ github.event.repository.updated_at }}",
            "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "job_status": "${{ job.status }}",
            "articles_added": $(git status --porcelain src/content/articles/ 2>/dev/null | wc -l)
          }
          EOF
          echo "wrote $STATUS_FILE"

      - name: Commit and push to main (with rebase retry)
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Real Daily Review Bot"
          git config user.email "bot@realdailyreview.com"
          git add src/content/articles/ ops/runs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "content: $(date -u +%Y-%m-%d) auto-publish [run ${{ github.run_id }}]"
          # Retry up to 5 times with rebase to handle concurrent commits to main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing on latest main and retrying"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 3; }
          done
          echo "::error::push failed after 5 attempts"
          exit 1
