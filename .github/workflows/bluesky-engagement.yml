name: Bluesky engagement tracker

# Pulls likes/reposts/replies for every post we've shipped, aggregates by
# hook strategy, writes to ops/social-posted/bluesky-engagement.json.
# Hook prompt iterations can read this to bias toward what works.

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6h
  push:
    tags:
      - 'bsky-eng-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluesky-engagement
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { ref: main, token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: node scripts/bluesky-engagement.mjs
      - run: |
          git config user.name "Ravi Sharma (Growth)"
          git config user.email "ravi@realdailyreview.com"
          git add ops/social-posted/bluesky-engagement.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "growth: bluesky engagement snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          exit 1
