name: Heartbeat

# Manual diagnostic workflow — dumps recent action runs + last failed
# daily-publish log into ops/diagnostics/. Useful from environments that
# can't reach api.github.com directly. Trigger via workflow_dispatch or
# by pushing a tag matching diag-*.

on:
  workflow_dispatch:
  push:
    tags:
      - 'diag-*'

permissions:
  contents: write
  actions: read

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update heartbeat
        run: |
          mkdir -p ops
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) — run ${{ github.run_id }} — sha ${{ github.sha }}" >> ops/heartbeat.txt
          tail -5 ops/heartbeat.txt

      - name: Smoke test API endpoints
        continue-on-error: true
        run: |
          mkdir -p ops/diagnostics
          {
            echo "Smoke test ran at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "=== GET https://realdailyreview.com/api/health ==="
            curl -s -o /tmp/health.json -w "HTTP %{http_code}\n" --max-time 8 \
              "https://realdailyreview.com/api/health" || true
            cat /tmp/health.json 2>/dev/null
            echo ""
            echo "=== POST https://realdailyreview.com/api/subscribe (no turnstile, expects 403) ==="
            curl -s -o /tmp/sub.json -w "HTTP %{http_code}\n" --max-time 8 \
              -X POST -H "Content-Type: application/json" \
              -d '{"email":"smoketest@example.com"}' \
              "https://realdailyreview.com/api/subscribe" || true
            cat /tmp/sub.json 2>/dev/null
            echo ""
            echo "=== Site root ==="
            curl -s -o /dev/null -w "HTTP %{http_code} | size %{size_download}\n" --max-time 8 \
              "https://realdailyreview.com" || true
          } > ops/diagnostics/smoke-test.txt 2>&1
          cat ops/diagnostics/smoke-test.txt

      - name: Dump recent action runs (so sandbox can read)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ops/diagnostics
          # Latest 10 runs across all workflows
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=10" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          rows = [{
            'id': r['id'],
            'name': r['name'],
            'status': r['status'],
            'conclusion': r['conclusion'],
            'event': r['event'],
            'created_at': r['created_at'],
            'updated_at': r['updated_at'],
            'run_number': r['run_number'],
            'head_branch': r['head_branch'],
            'head_sha': r['head_sha'][:8],
            'html_url': r['html_url'],
          } for r in d.get('workflow_runs', [])]
          print(json.dumps(rows, indent=2))
          " > ops/diagnostics/recent-runs.json
          echo "wrote $(wc -l < ops/diagnostics/recent-runs.json) lines"
          # Also dump failed-run logs URL list for the latest 3 failed
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=failure&per_page=3" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for r in d.get('workflow_runs', []):
            print(f\"=== FAILED: {r['name']} #{r['run_number']} ({r['conclusion']}) ===\")
            print(f\"URL: {r['html_url']}\")
            print(f\"Started: {r['created_at']}\")
            print(f\"Head SHA: {r['head_sha'][:8]}\")
            print()
          " > ops/diagnostics/failed-runs.txt
          cat ops/diagnostics/failed-runs.txt

      - name: Dump logs of latest failed run (any workflow)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p ops/diagnostics
          RUN_INFO=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=failure&per_page=1" \
            | python3 -c "
          import sys,json
          d = json.load(sys.stdin)
          r = d.get('workflow_runs', [])
          if r:
              print(f\"{r[0]['id']}|{r[0]['name']}\")")
          if [ -z "$RUN_INFO" ]; then
            echo "No failed runs found" > ops/diagnostics/latest-failed-log.txt
          else
            RUN_ID=$(echo "$RUN_INFO" | cut -d'|' -f1)
            RUN_NAME=$(echo "$RUN_INFO" | cut -d'|' -f2-)
            echo "Latest failed run: '$RUN_NAME' (#$RUN_ID)" > ops/diagnostics/latest-failed-log.txt
            curl -s -L -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/logs" \
              -o /tmp/logs.zip 2>&1
            cd /tmp && rm -rf logs/ && unzip -o logs.zip -d logs/ > /dev/null 2>&1 || true
            cd - > /dev/null
            echo "--- log files ---" >> ops/diagnostics/latest-failed-log.txt
            find /tmp/logs -name "*.txt" 2>/dev/null | head -25 >> ops/diagnostics/latest-failed-log.txt
            echo "" >> ops/diagnostics/latest-failed-log.txt
            echo "--- error/failure lines from each step ---" >> ops/diagnostics/latest-failed-log.txt
            for f in /tmp/logs/*/*.txt /tmp/logs/*.txt; do
              [ -f "$f" ] || continue
              echo "" >> ops/diagnostics/latest-failed-log.txt
              echo "=== $(basename $(dirname $f))/$(basename $f) ===" >> ops/diagnostics/latest-failed-log.txt
              grep -nE "error|fail|##\\[error\\]|exit code|Error" "$f" | tail -25 >> ops/diagnostics/latest-failed-log.txt || true
            done
            # Also dump the LAST 80 lines of every log file so we see what happened at the end
            echo "" >> ops/diagnostics/latest-failed-log.txt
            echo "--- last 80 lines of each step log ---" >> ops/diagnostics/latest-failed-log.txt
            for f in /tmp/logs/*/*.txt /tmp/logs/*.txt; do
              [ -f "$f" ] || continue
              echo "" >> ops/diagnostics/latest-failed-log.txt
              echo "=== END OF $(basename $f) ===" >> ops/diagnostics/latest-failed-log.txt
              tail -80 "$f" >> ops/diagnostics/latest-failed-log.txt
            done
          fi
      - name: Commit & push (rebase retry)
        run: |
          git config user.name "Real Daily Review Bot"
          git config user.email "bot@realdailyreview.com"
          git add ops/heartbeat.txt ops/diagnostics/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "ops: heartbeat $(date -u +%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          exit 1
