name: Heartbeat

# Diagnostic workflow — every push to main writes a timestamped heartbeat file.
# Used to verify Actions is firing. Safe to delete once daily-publish is reliable.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ops/heartbeat.txt'
      - 'ops/runs/**'
      - 'src/content/articles/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update heartbeat
        run: |
          mkdir -p ops
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) — run ${{ github.run_id }} — sha ${{ github.sha }}" >> ops/heartbeat.txt
          tail -5 ops/heartbeat.txt

      - name: Dump recent action runs (so sandbox can read)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ops/diagnostics
          # Latest 10 runs across all workflows
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=10" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          rows = [{
            'id': r['id'],
            'name': r['name'],
            'status': r['status'],
            'conclusion': r['conclusion'],
            'event': r['event'],
            'created_at': r['created_at'],
            'updated_at': r['updated_at'],
            'run_number': r['run_number'],
            'head_branch': r['head_branch'],
            'head_sha': r['head_sha'][:8],
            'html_url': r['html_url'],
          } for r in d.get('workflow_runs', [])]
          print(json.dumps(rows, indent=2))
          " > ops/diagnostics/recent-runs.json
          echo "wrote $(wc -l < ops/diagnostics/recent-runs.json) lines"
          # Also dump failed-run logs URL list for the latest 3 failed
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=failure&per_page=3" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for r in d.get('workflow_runs', []):
            print(f\"=== FAILED: {r['name']} #{r['run_number']} ({r['conclusion']}) ===\")
            print(f\"URL: {r['html_url']}\")
            print(f\"Started: {r['created_at']}\")
            print(f\"Head SHA: {r['head_sha'][:8]}\")
            print()
          " > ops/diagnostics/failed-runs.txt
          cat ops/diagnostics/failed-runs.txt

      - name: Dump logs of most-recent failed daily-publish run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p ops/diagnostics
          RUN_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-publish.yml/runs?per_page=1" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('workflow_runs',[]);print(r[0]['id'] if r else '')")
          if [ -z "$RUN_ID" ]; then
            echo "No daily-publish runs found" > ops/diagnostics/daily-publish-log.txt
          else
            echo "Fetching logs for run $RUN_ID" > ops/diagnostics/daily-publish-log.txt
            curl -s -L -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/logs" \
              -o /tmp/logs.zip 2>&1
            ls -la /tmp/logs.zip >> ops/diagnostics/daily-publish-log.txt
            cd /tmp && unzip -o logs.zip -d logs/ > /dev/null 2>&1 || true
            cd - > /dev/null
            echo "--- log files ---" >> ops/diagnostics/daily-publish-log.txt
            find /tmp/logs -name "*.txt" 2>/dev/null | head -20 >> ops/diagnostics/daily-publish-log.txt
            echo "--- last 200 lines of every log ---" >> ops/diagnostics/daily-publish-log.txt
            for f in /tmp/logs/*.txt; do
              [ -f "$f" ] || continue
              echo "=== $(basename $f) ===" >> ops/diagnostics/daily-publish-log.txt
              tail -200 "$f" >> ops/diagnostics/daily-publish-log.txt
            done
          fi
      - name: Commit & push (rebase retry)
        run: |
          git config user.name "Real Daily Review Bot"
          git config user.email "bot@realdailyreview.com"
          git add ops/heartbeat.txt ops/diagnostics/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "ops: heartbeat $(date -u +%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          exit 1
