name: Autonomous feature builder

# Cron 2x/day. Picks the first eligible queue item and ships the code.
# Auto-merges if the change is small AND inside the auto-merge allowlist.
# Everything else opens a PR for human review.
#
# To trigger on demand from sandbox: push a tag matching 'build-feature-*'.

on:
  schedule:
    # 06:30 UTC (2:30 AM ET — overnight build window)
    - cron: '30 6 * * *'
    # 19:30 UTC (3:30 PM ET — afternoon build window)
    - cron: '30 19 * * *'
  push:
    tags:
      - 'build-feature-*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: feature-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install repo dependencies
        run: npm ci

      - name: Run feature builder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/feature-build.mjs
