name: Autonomous feature builder

# Cron 2x/day. Picks the first eligible queue item and ships the code.
# Auto-merges if the change is small AND inside the auto-merge allowlist.
# Everything else opens a PR for human review.
#
# To trigger on demand from sandbox: push a tag matching 'build-feature-*'.

on:
  schedule:
    # 4x/day so queue items don't stall. Each run picks one item.
    - cron: '0 5 * * *'   # 05:00 UTC (1am ET)
    - cron: '0 11 * * *'  # 11:00 UTC (7am ET)
    - cron: '0 17 * * *'  # 17:00 UTC (1pm ET)
    - cron: '0 23 * * *'  # 23:00 UTC (7pm ET)
  push:
    tags:
      - 'build-feature-*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: feature-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install repo dependencies
        run: npm ci

      - name: Run feature builder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/feature-build.mjs
