name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          ANTHROPIC_API_KEY: placeholder

      - name: Patch all functions — nodejs20.x + maxDuration 300s
        run: |
          find .vercel/output/functions -name '.vc-config.json' | while read f; do
            node -e "
              const fs=require('fs'), p='$f';
              const cfg=JSON.parse(fs.readFileSync(p));
              cfg.runtime='nodejs20.x';
              cfg.maxDuration=300;
              fs.writeFileSync(p, JSON.stringify(cfg, null, '\\t'));
            "
          done

      - name: Deploy to Vercel production
        run: npx vercel deploy --prebuilt --prod --token $VERCEL_TOKEN --scope revv-team --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_STzeS2bdoSjZAaaRoKtoodMs
          VERCEL_PROJECT_ID: prj_LKVKVMRMWncXNdfOrAEeep48q2zH
