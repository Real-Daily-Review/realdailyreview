name: CEO standup (4x/day)

# Cloud-based, runs every 6 hours — no dependency on user's computer.
# Each run: pulls roadmap + queue + recent commits, marks done items,
# generates 1-3 new tasks if queue is thin, commits a per-slot checkpoint.

on:
  schedule:
    # 6x/day — every 4 hours.
    - cron: '0 0 * * *'   # 00:00 UTC
    - cron: '0 4 * * *'   # 04:00 UTC
    - cron: '0 8 * * *'   # 08:00 UTC
    - cron: '0 12 * * *'  # 12:00 UTC
    - cron: '0 16 * * *'  # 16:00 UTC
    - cron: '0 20 * * *'  # 20:00 UTC
  push:
    tags:
      - 'run-standup-*'
  workflow_dispatch:
    inputs:
      slot_label:
        description: 'Override slot label (morning/midday/evening/overnight)'
        required: false
        default: 'manual'

permissions:
  contents: write
  actions: read

concurrency:
  group: standup
  cancel-in-progress: false

jobs:
  standup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install minimal deps
        run: npm install gray-matter@^4 @anthropic-ai/sdk@^0.30 --no-save --no-audit --no-fund

      - name: Run CEO operator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLOT_OVERRIDE: ${{ github.event.inputs.slot_label }}
        run: node scripts/ceo-standup.mjs

      - name: Commit standup + queue updates (rebase retry)
        run: |
          git config user.name "Real Daily Review Bot"
          git config user.email "bot@realdailyreview.com"
          git add ops/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "ops: standup $(date -u +%Y-%m-%dT%H:%MZ) [run ${{ github.run_id }}]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          exit 1
